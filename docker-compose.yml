version: '3.9'
services:
  app:
    image: node:20
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    environment:
      - PORT=3900
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    command: sh -c "npm install && npm run build && npm run start"
    ports:
      - '3900:3900'
